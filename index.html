<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SURVIVAL: LOST WORLD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172522;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
#game{position:relative;width:100%;height:100%;overflow:hidden}
#loading{position:absolute;z-index:5;inset:0;overflow:hidden;background:#172522;color:#e9e4d6;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;transition:opacity .5s ease}
#loading .ld-name{position:absolute;top:max(18px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));margin:0;font-size:15px;color:#93a89f}
#loading .terrain{position:absolute;right:-12vmin;top:-14vmin;width:min(150vmin,1200px);aspect-ratio:1;overflow:visible}
#loading .terrain path.c{fill:none;stroke:#3f5b52;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
#loading .terrain path.c.idx{stroke:#5f8074;stroke-width:3.4}
#loading .terrain path.c.live{stroke:#f0a45d}
#loading .terrain text{font:italic 21px "Iowan Old Style",Palatino,Georgia,serif;fill:#8aa398;text-anchor:middle;paint-order:stroke;stroke:#172522;stroke-width:8px;opacity:0;transition:opacity .5s}
#loading .terrain text.on{opacity:1}
#loading #summit{fill:#f0a45d;opacity:0;transition:opacity .4s}
#loading #summit.on{opacity:1}
#loading .ld-panel{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(28px,env(safe-area-inset-bottom));width:min(440px,calc(100% - 48px))}
#loading .ld-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:clamp(18px,2.4vw,22px);line-height:1.3}
#loading .ld-pct{font-variant-numeric:tabular-nums;color:#f0a45d}
#loading .ld-line{height:2px;margin-top:14px;background:#2b413a}
#loading .ld-line i{display:block;height:100%;background:#f0a45d;transform-origin:left;transform:scaleX(0)}
#loading .ld-hint{margin:12px 0 0;font-size:14px;line-height:1.55;font-style:italic;color:#93a89f}
#loading.failed .ld-row{color:#ee9b82}
#loading.failed .ld-line i{background:#ee9b82}
#loading .ld-retry{margin-top:16px;padding:10px 18px;font:inherit;font-size:15px;color:#172522;background:#f0a45d;border:0;border-radius:4px;cursor:pointer}
#loading .ld-retry:focus-visible{outline:2px solid #e9e4d6;outline-offset:3px}
#loading .ld-detail{display:block;margin-top:8px;font-style:normal;font-size:12px;color:#6f877c;word-break:break-word}
#loading .ld-panel[hidden],#loading .auth[hidden]{display:none}
#loading .auth{position:absolute;left:max(24px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);width:min(360px,calc(100% - 48px));display:flex;flex-direction:column;gap:14px;padding:22px;background:#172522e8;border-radius:6px}
#loading .auth h1{margin:0 0 2px;font-size:28px;font-weight:600}
#loading .auth label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#93a89f}
#loading .auth label[hidden]{display:none}
#loading .auth input{font:inherit;font-size:17px;padding:10px 12px;color:#e9e4d6;background:#10201c;border:1px solid #3f5b52;border-radius:4px}
#loading .auth input:focus-visible{outline:2px solid #f0a45d;outline-offset:1px}
#loading .auth input:disabled{opacity:.6}
#loading .a-msg{margin:0;min-height:1.4em;font-size:14px;line-height:1.4;color:#ee9b82}#loading .a-msg.ok{color:#9fd3a8}
#loading .a-go{width:100%;margin-top:0}#loading .ld-retry:disabled{opacity:.6;cursor:default}
#loading .a-switch{margin:0;font-size:14px;color:#93a89f}
#loading .a-switch button{padding:0;font:inherit;color:#f0a45d;background:none;border:0;text-decoration:underline;cursor:pointer}
@media(prefers-reduced-motion:reduce){#loading,#loading .terrain text,#loading #summit{transition:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="game">
  <div id="loading" role="progressbar" aria-label="Memuat game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-busy="true">
    <p class="ld-name">Survival: Lost World</p>
    <svg class="terrain" viewBox="0 0 1000 1000" aria-hidden="true"><g id="contours"></g><path id="summit"/></svg>
    <div class="ld-panel">
      <div class="ld-row"><span id="ldStage" aria-live="polite">Menyiapkan peta</span><span class="ld-pct" id="ldPct">0%</span></div>
      <div class="ld-line"><i id="ldFill"></i></div>
      <p class="ld-hint" id="ldHint"></p>
    </div>
    <form class="auth" id="auth" hidden novalidate>
      <h1 id="aTitle">Masuk</h1>
      <label>Username<input id="aUser" autocomplete="username" maxlength="16" autocapitalize="none" spellcheck="false"></label>
      <label>Password<input id="aPass" type="password" autocomplete="current-password"></label>
      <label id="aConfWrap" hidden>Ulangi password<input id="aConf" type="password" autocomplete="new-password"></label>
      <p class="a-msg" id="aMsg" role="alert"></p>
      <button class="ld-retry a-go" id="aGo">Masuk</button>
      <p class="a-switch"><span id="aAsk">Belum punya akun?</span> <button type="button" id="aSwap">Daftar</button></p>
    </form>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
